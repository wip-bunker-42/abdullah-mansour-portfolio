version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compatible-toolchain:
        update-types: [minor, patch]
    ignore:
      # The current Astro checker supports TypeScript 5/6. Revisit with its next major.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Keep project type declarations aligned with the pinned Node 24 runtime.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      compatible-actions:
        update-types: [minor, patch]
